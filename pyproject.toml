[project]
name = "neurito"
version = "0.1.0"
description = "Neurito: mascota virtual con red neuronal en NumPy, pero no afecta nada."
readme = "README.md"
authors = [
    { name = "Terminator2424", email = "edisonjgv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pygame-ce>=2.5.8",
]

[project.scripts]
neurito = "neurito:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
